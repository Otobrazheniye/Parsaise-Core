name: Backend PostgreSQL Integration Tests

on:
  push:
    branches:
      - develop
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: pc89_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d pc89_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-testing-key-not-for-production-1234567890abcdef
      TEST_POSTGRES_DB: pc89_ci
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: |
          python manage.py check \
            --settings=config.settings.integration

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: |
          python manage.py test accounts.test_integration \
            --settings=config.settings.integration \
            --noinput -v 2
            